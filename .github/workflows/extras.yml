# FORK-LOCAL WORKFLOW -- no upstream counterpart.
#
# Upstream (TokisanGames/Terrain3D) has no file by this name, so this workflow can
# never merge-conflict. Put ALL fork-specific build customization HERE rather than
# editing upstream's workflows (android.yml, windows.yml, ...) or the shared
# composite actions under .github/actions/ -- those are kept byte-identical to
# upstream so `git merge upstream/main` stays clean.
#
# Produces every library Erios ships, web excluded, as ONE drop-in artifact:
#
#   from upstream's reusable workflows, called unmodified
#     windows  x86_64, arm64      linux  x86_64
#     android  arm64, arm32       macos  universal      ios  universal
#   from the fork-local `gaps` matrix
#     windows  x86_32             android  x86_64
#
# Web is deliberately not built: Erios does not export for it. Upstream's own
# build.yml still builds every platform including web, on pull_request and
# workflow_dispatch; this workflow is the push-to-main path and merges into a
# differently named artifact, so the two never collide.
#
# The SCons cache below is deliberately NOT upstream's load-cache action: that one
# keys on the branch ref and skips saving on an exact hit, which freezes the cache
# at its first-run contents forever. Here the key rolls per run and the save is
# unconditional, so each run starts from the previous run's cache and only
# recompiles what actually changed.

name: 🧩 All Platforms Except Web
on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: extras-${{ github.ref }}
  cancel-in-progress: true

env:
  SCONS_CACHE_DIR: ${{ github.workspace }}/.scons-cache
  # Cap the cache dir before saving. SCons never evicts, and Terrain3D's
  # SConstruct honours only SCONS_CACHE (no cache_limit option), so without this
  # the tarball grows every run until restore/save costs more than it saves.
  CACHE_LIMIT_MB: 1500

jobs:
  # --- Upstream's matrices, reused as-is -------------------------------------
  windows:
    name: 🪟 Windows
    uses: ./.github/workflows/windows.yml

  linux:
    name: 🐧 Linux
    uses: ./.github/workflows/linux.yml

  android:
    name: 🤖 Android
    uses: ./.github/workflows/android.yml

  macos:
    name: 🍎 macOS
    uses: ./.github/workflows/macos.yml

  ios:
    name: 🍏 iOS
    uses: ./.github/workflows/ios.yml

  # --- The two configs no upstream workflow covers ---------------------------
  # One job per config, deliberately. godot-cpp picks its builtin type sizes from
  # `arch` ("32" if "32" in env["arch"] else "64"), but the SCons builder that
  # generates gen/ depends only on extension_api.json, so a second build in the
  # same workspace silently reuses the first one's headers. Building windows
  # x86_32 and android x86_64 in one job therefore produced an x86_64 library with
  # 32-bit StringName/Variant sizes, which segfaults the engine during GDExtension
  # init. Never pair two different bit-widths in one workspace.
  gaps:
    name: 🧩 ${{ matrix.config.platform }} ${{ matrix.config.arch }} ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: [ template_debug, template_release ]
        config:
          - platform: windows
            arch: x86_32
          - platform: android
            arch: x86_64

    env:
      CACHE_NAME: extras-${{ matrix.config.platform }}-${{ matrix.config.arch }}-${{ matrix.target }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      # Upstream's action. Gives us Python + SCons, plus the Android NDK for the
      # android config.
      - name: Setup Dependencies
        uses: ./.github/actions/dependencies
        with:
          platform: ${{ matrix.config.platform }}
          arch: ${{ matrix.config.arch }}

      # Fork-local: upstream's windows branches only cover x86_64/arm64, so x86_32
      # needs the i686 toolchain, specifically the POSIX (gthreads) variant. The
      # win32 variant ships no std::mutex, which fails partway through the build
      # rather than up front.
      - name: Setup Windows Mingw32
        if: matrix.config.arch == 'x86_32'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y mingw-w64 gcc-mingw-w64-i686-posix g++-mingw-w64-i686-posix
          sudo update-alternatives --set i686-w64-mingw32-gcc /usr/bin/i686-w64-mingw32-gcc-posix
          sudo update-alternatives --set i686-w64-mingw32-g++ /usr/bin/i686-w64-mingw32-g++-posix
          i686-w64-mingw32-g++ --version
          echo "=== Sanity check: std::mutex compiles ==="
          cat > /tmp/mutex_test.cpp <<'CPP'
          #include <mutex>
          int main() { std::mutex m; (void)m; return 0; }
          CPP
          i686-w64-mingw32-g++ -std=c++17 /tmp/mutex_test.cpp -c -o /tmp/mutex_test.o
          echo "OK: std::mutex works."

      # Rolling cache, keyed per config so no two bit-widths ever share generated
      # headers or objects.
      - name: Restore SCons Cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.SCONS_CACHE_DIR }}
          key: ${{ env.CACHE_NAME }}-${{ github.run_id }}
          restore-keys: |
            ${{ env.CACHE_NAME }}-

      - name: Build Terrain3D
        shell: bash
        env:
          SCONS_CACHE: ${{ env.SCONS_CACHE_DIR }}
        run: |
          set -euo pipefail
          scons target=${{ matrix.target }} platform=${{ matrix.config.platform }} arch=${{ matrix.config.arch }} debug_symbols=no -j4

      # Guards the bug this job's shape exists to avoid. The generated-bindings check is the
      # one that matters: the library that shipped 32-bit StringName/Variant sizes was itself
      # a perfectly well-formed 64-bit ELF, so inspecting the output alone cannot see it.
      - name: Verify Build
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.config.arch }}" in
            *64) want_bits=64; want_size=8 ;;
            *32) want_bits=32; want_size=4 ;;
            *) echo "::error::unhandled arch ${{ matrix.config.arch }}"; exit 1 ;;
          esac

          # 1. godot-cpp's gen/ must match this arch's pointer size. A stale gen/ left by a
          #    build of a different arch is what produced a 64-bit .so with 4-byte StringName.
          hdr=godot-cpp/gen/include/godot_cpp/variant/string_name.hpp
          got_size=$(sed -n 's/.*STRING_NAME_SIZE = \([0-9]*\).*/\1/p' "$hdr" | head -1)
          echo "STRING_NAME_SIZE=${got_size} (want ${want_size})"
          if [ "$got_size" != "$want_size" ]; then
            echo "::error::generated bindings are for the wrong word size, gen/ is stale"
            exit 1
          fi

          # 2. And the library really is the architecture we asked for. Read the headers rather
          #    than parse `file`, whose wording differs per format (PE says "PE32"/"Intel 80386",
          #    never "32-bit", and "PE32+" means 64-bit).
          python3 - "$want_bits" <<'PY'
          import glob, struct, sys

          want = int(sys.argv[1])
          files = [f for f in glob.glob("project/addons/terrain_3d/bin/*") if not f.endswith(".a")]
          if not files:
              raise SystemExit("::error::no libraries were produced")
          for f in files:
              d = open(f, "rb").read(0x400)
              if d[:4] == b"\x7fELF":
                  bits = 64 if d[4] == 2 else 32
              elif d[:2] == b"MZ":
                  machine = struct.unpack_from("<H", d, struct.unpack_from("<I", d, 0x3C)[0] + 4)[0]
                  bits = {0x8664: 64, 0xAA64: 64, 0x14C: 32}.get(machine)
                  if bits is None:
                      raise SystemExit(f"::error::{f}: unknown PE machine 0x{machine:04x}")
              else:
                  raise SystemExit(f"::error::{f}: unrecognised binary format")
              print(f"{f}: {bits}-bit")
              if bits != want:
                  raise SystemExit(f"::error::{f} is {bits}-bit, expected {want}-bit")
          PY

      # Drop the least-recently-modified entries until under the cap.
      - name: Trim SCons Cache
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          dir="${{ env.SCONS_CACHE_DIR }}"
          limit_mb="${{ env.CACHE_LIMIT_MB }}"
          [ -d "$dir" ] || exit 0

          list=$(mktemp)
          find "$dir" -type f -printf '%T@\t%s\t%p\n' | sort -n > "$list"
          total_mb=$(awk -F'\t' '{s+=$2} END {print int(s/1048576)}' "$list")
          echo "cache size: ${total_mb} MB (cap ${limit_mb} MB)"

          if [ "$total_mb" -gt "$limit_mb" ]; then
            need=$(( (total_mb - limit_mb) * 1048576 ))
            awk -F'\t' -v need="$need" '{ if (freed < need) { print $3; freed += $2 } }' "$list" | tr '\n' '\0' | xargs -0 -r rm -f
            echo "trimmed to $(du -sm "$dir" | cut -f1) MB"
          fi
          rm -f "$list"

      # Unconditional, so a run that fails partway still banks its progress.
      - name: Save SCons Cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: ${{ env.SCONS_CACHE_DIR }}
          key: ${{ env.CACHE_NAME }}-${{ github.run_id }}

      # Mirrors upstream's build-artifact action so the merge below folds every
      # platform into one addon folder.
      - name: Prepare Files
        shell: bash
        run: |
          set -euo pipefail
          rm -v project/*.* || true
          cp -v "${{ github.workspace }}/README.md" "${{ github.workspace }}/LICENSE.txt" "${{ github.workspace }}/project/addons/terrain_3d/"

      - name: Upload Package
        uses: actions/upload-artifact@v7
        with:
          include-hidden-files: true
          name: t3d-${{ env.CACHE_NAME }}
          path: ${{ github.workspace }}/project/

  # --- One artifact holding every platform above -----------------------------
  merge:
    name: 📦 Merge
    runs-on: ubuntu-24.04
    needs: [ windows, linux, android, macos, ios, gaps ]
    steps:
      - name: Merge Artifacts
        uses: actions/upload-artifact/merge@v7
        with:
          include-hidden-files: true
          name: terrain3d-all-except-web
          pattern: t3d-*
          delete-merged: true
