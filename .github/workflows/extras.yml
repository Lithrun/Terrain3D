# FORK-LOCAL WORKFLOW -- no upstream counterpart.
#
# Upstream (TokisanGames/Terrain3D) has no file by this name, so this workflow can
# never merge-conflict. Put ALL fork-specific build customization HERE rather than
# editing upstream's workflows (android.yml, windows.yml, ...) or the shared
# composite actions under .github/actions/ -- those are kept byte-identical to
# upstream so `git merge upstream/main` stays clean.
#
# Produces every library Erios ships, web excluded, as ONE drop-in artifact:
#
#   from upstream's reusable workflows, called unmodified
#     windows  x86_64, arm64      linux  x86_64
#     android  arm64, arm32       macos  universal      ios  universal
#   from the fork-local `gaps` job
#     windows  x86_32             android  x86_64
#
# Web is deliberately not built: Erios does not export for it. Upstream's own
# build.yml still builds every platform including web, on pull_request and
# workflow_dispatch; this workflow is the push-to-main path and merges into a
# differently named artifact, so the two never collide.
#
# `gaps` builds both targets (debug + release) for each of its two configs.
# godot-cpp object files are
# named per platform.target.arch, so nothing is shared between the four configs --
# a cold run compiles the binding set four times over, ~25 min. The SCons cache
# below is what keeps subsequent runs short, so it is deliberately NOT upstream's
# load-cache action: that one keys on the branch ref and skips saving on an exact
# hit, which freezes the cache at its first-run contents forever. Here the key
# rolls per run and the save is unconditional, so each run starts from the
# previous run's cache and only recompiles what actually changed.

name: 🧩 All Platforms Except Web
on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: extras-${{ github.ref }}
  cancel-in-progress: true

env:
  CACHE_NAME: extras-windows-x86_32-android-x86_64
  SCONS_CACHE_DIR: ${{ github.workspace }}/.scons-cache
  # Cap the cache dir before saving. SCons never evicts, and Terrain3D's
  # SConstruct honours only SCONS_CACHE (no cache_limit option), so without this
  # the tarball grows every run until restore/save costs more than it saves.
  CACHE_LIMIT_MB: 1500

jobs:
  # --- Upstream's matrices, reused as-is -------------------------------------
  windows:
    name: 🪟 Windows
    uses: ./.github/workflows/windows.yml

  linux:
    name: 🐧 Linux
    uses: ./.github/workflows/linux.yml

  android:
    name: 🤖 Android
    uses: ./.github/workflows/android.yml

  macos:
    name: 🍎 macOS
    uses: ./.github/workflows/macos.yml

  ios:
    name: 🍏 iOS
    uses: ./.github/workflows/ios.yml

  # --- The two configs no upstream workflow covers ---------------------------
  gaps:
    name: 🧩 Windows x86_32 + Android x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      # Upstream's action. Gives us Python + SCons, and the Android NDK -- its
      # android branch keys off platform only, so x86_64 is covered. Its windows
      # branches only cover x86_64/arm64, so x86_32 is handled below.
      - name: Setup Dependencies
        uses: ./.github/actions/dependencies
        with:
          platform: android
          arch: x86_64

      # --- Fork-local toolchain setup ---------------------------------------
      # x86_32 needs the i686 toolchain, specifically the POSIX (gthreads)
      # variant -- the win32 variant ships no std::mutex, which fails the build
      # partway through rather than up front.
      - name: Setup Windows Mingw32
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            mingw-w64 \
            gcc-mingw-w64-i686-posix \
            g++-mingw-w64-i686-posix
          sudo update-alternatives --set i686-w64-mingw32-gcc /usr/bin/i686-w64-mingw32-gcc-posix
          sudo update-alternatives --set i686-w64-mingw32-g++ /usr/bin/i686-w64-mingw32-g++-posix

          echo "=== Toolchain in use ==="
          which i686-w64-mingw32-g++
          i686-w64-mingw32-g++ --version

          echo "=== Sanity check: std::mutex compiles ==="
          cat > /tmp/mutex_test.cpp <<'CPP'
          #include <mutex>
          int main() { std::mutex m; (void)m; return 0; }
          CPP
          i686-w64-mingw32-g++ -std=c++17 /tmp/mutex_test.cpp -c -o /tmp/mutex_test.o
          echo "OK: std::mutex works."

      # Rolling cache: unique key per run so the save always lands, with a prefix
      # restore-key so we inherit the most recent previous run's cache.
      - name: Restore SCons Cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.SCONS_CACHE_DIR }}
          key: ${{ env.CACHE_NAME }}-${{ github.run_id }}
          restore-keys: |
            ${{ env.CACHE_NAME }}-

      - name: Build Terrain3D
        shell: bash
        env:
          SCONS_CACHE: ${{ env.SCONS_CACHE_DIR }}
        run: |
          set -euo pipefail
          for target in template_debug template_release; do
            for combo in windows:x86_32 android:x86_64; do
              platform="${combo%%:*}"
              arch="${combo##*:}"
              echo "::group::scons platform=$platform arch=$arch target=$target"
              scons target="$target" platform="$platform" arch="$arch" debug_symbols=no -j4
              echo "::endgroup::"
            done
          done

      # Drop the least-recently-modified entries until under the cap.
      - name: Trim SCons Cache
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          dir="${{ env.SCONS_CACHE_DIR }}"
          limit_mb="${{ env.CACHE_LIMIT_MB }}"
          [ -d "$dir" ] || exit 0

          list=$(mktemp)
          find "$dir" -type f -printf '%T@\t%s\t%p\n' | sort -n > "$list"
          total_mb=$(awk -F'\t' '{s+=$2} END {print int(s/1048576)}' "$list")
          echo "cache size: ${total_mb} MB (cap ${limit_mb} MB)"

          if [ "$total_mb" -gt "$limit_mb" ]; then
            need=$(( (total_mb - limit_mb) * 1048576 ))
            awk -F'\t' -v need="$need" \
              '{ if (freed < need) { print $3; freed += $2 } }' "$list" \
              | tr '\n' '\0' | xargs -0 -r rm -f
            echo "trimmed to $(du -sm "$dir" | cut -f1) MB"
          fi
          rm -f "$list"

      # Unconditional, so a run that fails partway still banks its progress.
      - name: Save SCons Cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: ${{ env.SCONS_CACHE_DIR }}
          key: ${{ env.CACHE_NAME }}-${{ github.run_id }}

      # Mirrors upstream's build-artifact action so the artifact layout matches
      # the ones build.yml produces.
      - name: Prepare Files
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Built binaries ==="
          ls -l project/addons/terrain_3d/bin/
          rm -v project/*.* || true
          cp -v "${{ github.workspace }}/README.md" \
                "${{ github.workspace }}/LICENSE.txt" \
                "${{ github.workspace }}/project/addons/terrain_3d/"

      - name: Upload Package
        uses: actions/upload-artifact@v7
        with:
          include-hidden-files: true
          name: t3d-${{ env.CACHE_NAME }}
          path: ${{ github.workspace }}/project/

  # --- One artifact holding every platform above -----------------------------
  merge:
    name: 📦 Merge
    runs-on: ubuntu-24.04
    needs: [ windows, linux, android, macos, ios, gaps ]
    steps:
      - name: Merge Artifacts
        uses: actions/upload-artifact/merge@v7
        with:
          include-hidden-files: true
          name: terrain3d-all-except-web
          pattern: t3d-*
          delete-merged: true
