# FORK-LOCAL WORKFLOW -- no upstream counterpart.
#
# Upstream (TokisanGames/Terrain3D) has no file by this name, so this workflow can
# never merge-conflict. Put ALL fork-specific build customization HERE rather than
# editing upstream's workflows (android.yml, windows.yml, ...) or the shared
# composite actions under .github/actions/ -- those are kept byte-identical to
# upstream so `git merge upstream/main` stays clean.
#
# Builds the artifacts upstream does not, in a SINGLE job so both binaries land in
# one addon folder and upload as one ready-to-drop-in artifact:
#   - Windows x86_32   (upstream builds x86_64 + arm64 only)
#   - Android x86_64   (upstream builds arm64 + arm32 only)
#
# Both targets (debug + release) are built for each, so the artifact is a complete
# addon rather than a half-populated bin/. That is 4 scons runs back-to-back on one
# runner: slower wall-clock than parallel jobs, hence the raised timeout.

name: 🧩 Other Artifacts
on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: extras-${{ github.ref }}
  cancel-in-progress: true

env:
  CACHE_NAME: extras-windows-x86_32-android-x86_64

jobs:
  build:
    name: 🧩 Windows x86_32 + Android x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      # Upstream's action. Gives us Python + SCons, and the Android NDK -- its
      # android branch keys off platform only, so x86_64 is covered. Its windows
      # branches only cover x86_64/arm64, so x86_32 is handled below.
      - name: Setup Dependencies
        uses: ./.github/actions/dependencies
        with:
          platform: android
          arch: x86_64

      # --- Fork-local toolchain setup ---------------------------------------
      # x86_32 needs the i686 toolchain, specifically the POSIX (gthreads)
      # variant -- the win32 variant ships no std::mutex, which fails the build
      # partway through rather than up front.
      - name: Setup Windows Mingw32
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            mingw-w64 \
            gcc-mingw-w64-i686-posix \
            g++-mingw-w64-i686-posix
          sudo update-alternatives --set i686-w64-mingw32-gcc /usr/bin/i686-w64-mingw32-gcc-posix
          sudo update-alternatives --set i686-w64-mingw32-g++ /usr/bin/i686-w64-mingw32-g++-posix

          echo "=== Toolchain in use ==="
          which i686-w64-mingw32-g++
          i686-w64-mingw32-g++ --version

          echo "=== Sanity check: std::mutex compiles ==="
          cat > /tmp/mutex_test.cpp <<'CPP'
          #include <mutex>
          int main() { std::mutex m; (void)m; return 0; }
          CPP
          i686-w64-mingw32-g++ -std=c++17 /tmp/mutex_test.cpp -c -o /tmp/mutex_test.o
          echo "OK: std::mutex works."

      # One cache shared by all four builds. The SCons cache is content-addressed,
      # so mixing configs in a single directory is fine.
      - name: Load SCons Cache
        id: load-cache
        uses: ./.github/actions/load-cache
        with:
          cache-name: ${{ env.CACHE_NAME }}
        continue-on-error: true

      - name: Build Terrain3D
        shell: bash
        env:
          SCONS_CACHE: ${{ github.workspace }}/.scons-cache/
        run: |
          set -euo pipefail
          for target in template_debug template_release; do
            for combo in windows:x86_32 android:x86_64; do
              platform="${combo%%:*}"
              arch="${combo##*:}"
              echo "::group::scons platform=$platform arch=$arch target=$target"
              scons target="$target" platform="$platform" arch="$arch" debug_symbols=no -j4
              echo "::endgroup::"
            done
          done

      - name: Save SCons Cache
        if: steps.load-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ github.workspace }}/.scons-cache/
          key: ${{ env.CACHE_NAME }}-${{ github.ref }}

      # Mirrors upstream's build-artifact action so the artifact layout matches
      # the ones build.yml produces.
      - name: Prepare Files
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Built binaries ==="
          ls -l project/addons/terrain_3d/bin/
          rm -v project/*.* || true
          cp -v "${{ github.workspace }}/README.md" \
                "${{ github.workspace }}/LICENSE.txt" \
                "${{ github.workspace }}/project/addons/terrain_3d/"

      - name: Upload Package
        uses: actions/upload-artifact@v7
        with:
          include-hidden-files: true
          name: t3d-${{ env.CACHE_NAME }}
          path: ${{ github.workspace }}/project/
