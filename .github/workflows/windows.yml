name: 🪟 Windows Builds
on: [ workflow_call, workflow_dispatch ]

jobs:
  build:
    name: 🪟 Windows ${{ matrix.arch }} ${{ matrix.target }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        platform: [windows]
        target: [debug, release]
        arch: [x86_32]

    steps:
      - name: Checkout Terrain3D
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Base Dependencies
        uses: ./.github/actions/base-deps
        with:
          platform: ${{ matrix.platform }}

      # Ensure 32-bit MinGW exists when arch=x86_32
      - name: Install MinGW (x86_32 toolchain)
        if: ${{ matrix.arch == 'x86_32' }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y mingw-w64
          which i686-w64-mingw32-gcc || true
          i686-w64-mingw32-gcc --version || true

      # Hotfix for certain godot-cpp revisions missing <mutex> include
      - name: Patch godot-cpp headers (<mutex>) for x86_32
        if: ${{ matrix.arch == 'x86_32' }}
        shell: bash
        run: |
          set -euo pipefail
          HDR="godot-cpp/include/godot_cpp/core/class_db.hpp"

          if [ ! -f "$HDR" ]; then
            echo "ERROR: Header not found: $HDR"
            exit 1
          fi

          if ! grep -qE '^\s*#\s*include\s*<mutex>\s*$' "$HDR"; then
            echo "Patching $HDR to include <mutex>..."
            # Your error log shows <set> is present; insert <mutex> right after it.
            sed -i 's|#include <set>|#include <set>\n#include <mutex>|' "$HDR"
          else
            echo "<mutex> already included; no patch needed."
          fi

          echo "Includes in $HDR:"
          grep -nE '#\s*include\s*<(set|mutex)>' "$HDR" || true

      - name: Setup Build Cache
        uses: ./.github/actions/build-cache
        with:
          cache-name: ${{ matrix.platform }}-${{ matrix.target }}-${{ matrix.arch }}
        continue-on-error: true

      - name: Build Terrain3D
        env:
          SCONS_CACHE: "${{ github.workspace }}/.scons-cache/"
          TARGET: template_${{ matrix.target }}
          ARCH: ${{ matrix.arch }}
        shell: bash
        run: |
          set -euo pipefail
          scons target="$TARGET" platform="${{ matrix.platform }}" arch="$ARCH" debug_symbols=no -j2

      - name: Prepare Files
        shell: bash
        run: |
          set -euo pipefail
          ls -l project/addons/terrain_3d/bin/ || true

          # strip may fail if glob doesn't match or strip can't parse; don't fail the job for that
          strip project/addons/terrain_3d/bin/libterrain.* 2>/dev/null || true

          ls -l project/addons/terrain_3d/bin/ || true
          cp "${{ github.workspace }}/README.md" "${{ github.workspace }}/LICENSE.txt" "${{ github.workspace }}/project/addons/terrain_3d/"

      - name: Upload Package
        uses: actions/upload-artifact@v4
        with:
          include-hidden-files: true
          name: t3d-${{ matrix.platform }}-${{ matrix.arch }}-${{ matrix.target }}
          path: |
            ${{ github.workspace }}/project/

  merge:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Merge Artifacts
        uses: actions/upload-artifact/merge@v4
        with:
          include-hidden-files: true
          name: ${{ github.event.repository.name }}
          pattern: t3d-*
          delete-merged: true
