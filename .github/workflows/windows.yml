name: 🪟 Windows Builds
on: [ workflow_call, workflow_dispatch ]

jobs:
  build:
    name: 🪟 Windows ${{ matrix.arch }} ${{ matrix.target }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        platform: [windows]
        target: [debug, release]
        arch: [x86_32]

    steps:
      - name: Checkout Terrain3D
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Prove which workflow + matrix we're running (helps avoid "edited wrong file" issues)
      - name: DEBUG workflow/matrix
        shell: bash
        run: |
          echo "WORKFLOW: $GITHUB_WORKFLOW"
          echo "REF:      $GITHUB_REF"
          echo "SHA:      $GITHUB_SHA"
          echo "platform=${{ matrix.platform }}"
          echo "target=${{ matrix.target }}"
          echo "arch=${{ matrix.arch }}"

      - name: Setup Base Dependencies
        uses: ./.github/actions/base-deps
        with:
          platform: ${{ matrix.platform }}

      # Ensure 32-bit MinGW exists when arch=x86_32 (cross-compiling Windows on Ubuntu)
      - name: Install MinGW (x86_32 toolchain)
        if: ${{ matrix.arch == 'x86_32' }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y mingw-w64
          echo "Toolchain check:"
          which i686-w64-mingw32-gcc || true
          i686-w64-mingw32-gcc --version || true

      # Hotfix: some godot-cpp revisions use std::mutex without including <mutex>.
      # We patch the header BEFORE running scons. This step prints BEFORE/AFTER so you can
      # see in logs that it really applied.
      - name: Patch godot-cpp header to include <mutex> (x86_32)
        if: ${{ matrix.arch == 'x86_32' }}
        shell: bash
        run: |
          set -euo pipefail

          HDR="godot-cpp/include/godot_cpp/core/class_db.hpp"
          echo "Patching: $HDR"
          test -f "$HDR"

          echo "---- BEFORE (lines 40-70) ----"
          nl -ba "$HDR" | sed -n '40,70p'

          # Insert <mutex> after the first include of <set>, tolerant to whitespace/comments.
          if ! grep -qE '^\s*#\s*include\s*<mutex>\s*$' "$HDR"; then
            sed -i -E '0,/^\s*#\s*include\s*<set>\s*(\/\/.*)?$/s//&\n#include <mutex>/' "$HDR"
          fi

          # Fail early if we still don't see it (prevents wasting build time)
          if ! grep -qE '^\s*#\s*include\s*<mutex>\s*$' "$HDR"; then
            echo "ERROR: Failed to insert #include <mutex> into $HDR"
            exit 1
          fi

          echo "---- AFTER (lines 40-70) ----"
          nl -ba "$HDR" | sed -n '40,70p'

      - name: Setup Build Cache
        uses: ./.github/actions/build-cache
        with:
          cache-name: ${{ matrix.platform }}-${{ matrix.target }}-${{ matrix.arch }}
        continue-on-error: true

      - name: Build Terrain3D
        env:
          SCONS_CACHE: "${{ github.workspace }}/.scons-cache/"
          TARGET: template_${{ matrix.target }}
          ARCH: ${{ matrix.arch }}
        shell: bash
        run: |
          set -euo pipefail
          scons target="$TARGET" platform="${{ matrix.platform }}" arch="$ARCH" debug_symbols=no -j2

      - name: Prepare Files
        shell: bash
        run: |
          set -euo pipefail
          ls -l project/addons/terrain_3d/bin/ || true

          # strip can fail for some binaries or when glob doesn't match; don't fail the job for that
          strip project/addons/terrain_3d/bin/libterrain.* 2>/dev/null || true

          ls -l project/addons/terrain_3d/bin/ || true
          cp "${{ github.workspace }}/README.md" "${{ github.workspace }}/LICENSE.txt" "${{ github.workspace }}/project/addons/terrain_3d/"

      - name: Upload Package
        uses: actions/upload-artifact@v4
        with:
          include-hidden-files: true
          name: t3d-${{ matrix.platform }}-${{ matrix.arch }}-${{ matrix.target }}
          path: |
            ${{ github.workspace }}/project/

  merge:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Merge Artifacts
        uses: actions/upload-artifact/merge@v4
        with:
          include-hidden-files: true
          name: ${{ github.event.repository.name }}
          pattern: t3d-*
          delete-merged: true
